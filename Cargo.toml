[package]
name = "fast-disk-eraser"
version = "1.3.0"
edition = "2021"
authors = ["Akulav"]
description = "Fast Disk Eraser - securely erase files, folders and free disk space, made by Akulav"
repository = "https://github.com/Akulav/fast-disk-eraser"
homepage = "https://akulav.com"
license-file = "LICENSE"
build = "build.rs"

[[bin]]
name = "FastDiskEraser"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.32"
egui-phosphor = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hex = "0.4"
sha2 = "0.10"
dirs = "6"
sysinfo = { version = "0.35", default-features = false, features = ["disk"] }
open = "5"
crossbeam-channel = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
